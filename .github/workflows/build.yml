name: Build Multiplatform Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Single-File EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Official scrcpy for Windows
        shell: pwsh
        run: |
          $repo = "Genymobile/scrcpy"
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "scrcpy-win64-v.*\.zip" } | Select-Object -First 1
          Write-Host "Mengunduh: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "scrcpy.zip"
          Expand-Archive -Path "scrcpy.zip" -DestinationPath "scrcpy_temp"
          $scrcpyFolder = Get-ChildItem -Path "scrcpy_temp" -Directory | Select-Object -First 1
          Move-Item -Path "$($scrcpyFolder.FullName)\*" -Destination "." -Force
          Remove-Item -Path "scrcpy.zip", "scrcpy_temp" -Recurse -Force
          Get-ChildItem -Filter "*scrcpy*"

      - name: Build with PyInstaller (Single EXE)
        shell: pwsh
        run: |
          pyinstaller --noconsole --onefile `
            --add-binary "scrcpy.exe;." `
            --add-binary "adb.exe;." `
            --add-binary "AdbWinApi.dll;." `
            --add-binary "AdbWinUsbApi.dll;." `
            --add-data "scrcpy-server;." `
            --name "ScrcpyWiFiManager" `
            main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrcpyWiFiManager-Windows-x64
          path: dist/ScrcpyWiFiManager.exe

  build-linux:
    name: Build Linux Standalone Binary
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Linux Binary)
        run: |
          pyinstaller --noconsole --onefile \
            --name "ScrcpyWiFiManager-Linux" \
            main.py
          chmod +x dist/ScrcpyWiFiManager-Linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrcpyWiFiManager-Linux-x64
          path: dist/ScrcpyWiFiManager-Linux

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ScrcpyWiFiManager-Windows-x64
          path: release_assets/windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: ScrcpyWiFiManager-Linux-x64
          path: release_assets/linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/windows/ScrcpyWiFiManager.exe
            release_assets/linux/ScrcpyWiFiManager-Linux
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
